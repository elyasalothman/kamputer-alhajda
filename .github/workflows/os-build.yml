name: Build Alhajda OS

# Builds «الهجدة» (Ubuntu 24.04 based) live ISO + VM disks (VHDX / VMDK / qcow2),
# boots them headless in QEMU, uploads artifacts, and optionally publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OS version (e.g. 1.1.0)"
        default: "1.1.0"
        required: true
      publish:
        description: "Publish a GitHub (pre)release os-v<version> with the images"
        type: boolean
        default: false
      bottles_preinstall:
        description: "Bake Bottles (flatpak) into the image (+~1.5 GB). Otherwise it installs on first online boot."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alhajda-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax + shellcheck
        run: |
          set -e
          for f in os/build/*.sh os/update/*.sh os/rootfs-overlay/usr/local/sbin/* os/rootfs-overlay/usr/local/bin/*; do
            bash -n "$f"
          done
          shellcheck -S error os/build/*.sh os/update/*.sh os/rootfs-overlay/usr/local/sbin/* os/rootfs-overlay/usr/local/bin/*
      - name: alhajda-update unit test (fake releases API, temp root)
        run: |
          set -euo pipefail
          sudo apt-get install -y -q rsync >/dev/null
          T=$(mktemp -d); mkdir -p "$T/root/etc/alhajda" "$T/root/home/u"
          echo 1.0.0 > "$T/root/etc/alhajda/version"; echo mine > "$T/root/home/u/doc.txt"
          WORK="$T/work" bash os/update/make-selftest-server.sh "$T/srv" 99.0.0 8123 127.0.0.1
          (cd "$T/srv" && python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &); sleep 2
          U=os/rootfs-overlay/usr/local/bin/alhajda-update; API=http://127.0.0.1:8123/releases.json
          ALHAJDA_ROOT="$T/root" $U --check --api-url "$API" | tee "$T/check.txt"
          grep -q 'ALHAJDA_UPDATE: available current=1.0.0 latest=99.0.0' "$T/check.txt"
          ALHAJDA_ROOT="$T/root" $U --api-url "$API"
          test "$(cat "$T/root/etc/alhajda/version")" = 99.0.0
          grep -q 'ALHAJDA_VERSION="99.0.0"' "$T/root/usr/lib/os-release"
          test -f "$T/root/usr/share/alhajda/selftest-applied"
          test "$(cat "$T/root/home/u/doc.txt")" = mine
          ALHAJDA_ROOT="$T/root" $U --api-url "$API" | grep -q uptodate
          # tampered checksum must be refused
          echo 1.0.0 > "$T/root/etc/alhajda/version"
          echo "0000  alhajda-update-99.0.0.tar.gz" > "$T/srv/SHA256SUMS"
          if ALHAJDA_ROOT="$T/root" $U --api-url "$API"; then echo "::error::tampered bundle accepted"; exit 1; fi
          test "$(cat "$T/root/etc/alhajda/version")" = 1.0.0
          # bundle writing outside /etc,/usr must be refused
          mkdir -p "$T/evil/overlay/home/u"; echo x > "$T/evil/overlay/home/u/doc.txt"; echo 5 > "$T/evil/VERSION"
          tar -czf "$T/evil.tgz" -C "$T/evil" .
          if ALHAJDA_ROOT="$T/root" $U --bundle "$T/evil.tgz"; then echo "::error::unsafe bundle accepted"; exit 1; fi
          test "$(cat "$T/root/home/u/doc.txt")" = mine
          echo "alhajda-update unit test PASS"
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem os/windows -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $bad++; $e | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($bad) { exit 1 }
      - name: JSON
        run: python3 -m json.tool os/branding/firefox-policies.json > /dev/null

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ALHAJDA_VERSION: ${{ inputs.version }}
      BOTTLES_PREINSTALL: ${{ inputs.bottles_preinstall }}
      UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
      WORK: /mnt/alhajda-work
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            grub-common dosfstools gdisk qemu-utils qemu-system-x86 ovmf socat imagemagick zip rsync
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM — smoke tests will be slow (TCG)"

      - name: Build rootfs (debootstrap + XFCE + Arabic + Wine + Firefox)
        run: sudo -E bash os/build/build-rootfs.sh

      - name: Build live ISO
        run: sudo -E bash os/build/build-iso.sh

      - name: Build VM disk images (VHDX / VMDK / qcow2)
        run: sudo -E bash os/build/build-disk.sh

      - name: Branding preview
        if: always()
        run: |
          mkdir -p "$WORK/smoke"
          sudo cp "$WORK/chroot/usr/share/backgrounds/alhajda/alhajda-wallpaper.png" "$WORK/smoke/wallpaper-preview.png" || true
          sudo cp "$WORK/chroot/usr/share/alhajda/icons/alhajda-logo.png" "$WORK/smoke/logo-preview.png" || true
          sudo chown -R "$USER" "$WORK/smoke" "$WORK/out" || true
          cat "$WORK/chroot/etc/os-release" || true

      - name: Prepare in-VM update self-test (fake releases API + bundle 99.0.0)
        run: bash os/update/make-selftest-server.sh "$WORK/selftest-api" 99.0.0 8099

      - name: Smoke test — VM disk, BIOS (raw) + in-VM alhajda-update self-test
        env:
          UPDATE_SELFTEST_DIR: /mnt/alhajda-work/selftest-api
        run: bash os/build/smoke-test.sh disk-bios bios disk "$WORK/alhajda-${ALHAJDA_VERSION}.raw" raw 1200

      - name: Smoke test — VHDX, UEFI (Hyper-V Gen2 path)
        run: bash os/build/smoke-test.sh vhdx-uefi uefi disk "$WORK/out/alhajda-${ALHAJDA_VERSION}-hyperv.vhdx" vhdx 900

      - name: Smoke test — live ISO, BIOS
        run: bash os/build/smoke-test.sh iso-bios bios cdrom "$WORK/out/alhajda-${ALHAJDA_VERSION}-amd64.iso" raw 1200

      - name: Upload smoke logs + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alhajda-smoke-logs
          path: /mnt/alhajda-work/smoke/
          if-no-files-found: warn

      - name: Package (zip / checksums / split)
        run: |
          sudo rm -f "$WORK/alhajda-${ALHAJDA_VERSION}.raw"
          sudo rm -rf "$WORK/chroot"
          bash os/update/build-update-bundle.sh
          bash os/build/package.sh
          df -h /mnt

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: alhajda-${{ inputs.version }}-iso
          path: /mnt/alhajda-work/out/release/*.iso*
          compression-level: 0
          retention-days: 14
      - name: Upload Hyper-V VHDX
        uses: actions/upload-artifact@v4
        with:
          name: alhajda-${{ inputs.version }}-hyperv-vhdx
          path: /mnt/alhajda-work/out/release/*.vhdx.zip*
          compression-level: 0
          retention-days: 14
      - name: Upload VirtualBox VMDK
        uses: actions/upload-artifact@v4
        with:
          name: alhajda-${{ inputs.version }}-virtualbox-vmdk
          path: /mnt/alhajda-work/out/release/*.vmdk*
          compression-level: 0
          retention-days: 14
      - name: Upload qcow2 + checksums + update bundle + Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: alhajda-${{ inputs.version }}-qcow2
          path: |
            /mnt/alhajda-work/out/release/*.qcow2*
            /mnt/alhajda-work/out/release/SHA256SUMS
            /mnt/alhajda-work/out/release/*.tar.gz
            /mnt/alhajda-work/out/release/*.cmd
            /mnt/alhajda-work/out/release/*.ps1
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub pre-release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: os-v${{ inputs.version }}
          name: "الهجدة (Alhajda OS) ${{ inputs.version }}"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            «الهجدة» ${{ inputs.version }} — مبني على Ubuntu 24.04 LTS.
            **التثبيت بخطوة واحدة:** https://alhajda.com/os — الصق في PowerShell: `irm https://alhajda.com/os.ps1 | iex` أو شغّل `AlhajdaSetup.cmd`.
            - **التحديث:** داخل النظام «تحديث الهجدة» (تلقائي أسبوعياً، الحزمة `alhajda-update-${{ inputs.version }}.tar.gz`) + تحديثات أوبونتو الأمنية التلقائية.
            - Hyper-V / VirtualBox بدون فلاشة: `install-alhajda-vm.ps1` (يُشغَّل تلقائياً من الأمر أعلاه).
            - ISO حي (Live) — ملفات `.partNN` تُدمج تلقائياً بالسكربتات (أو `copy /b` يدوياً).
            - المستخدم الافتراضي في القرص الافتراضي: `alhajda` / كلمة المرور `alhajda` (غيّرها).
            See os/README.md. SHA256SUMS lists the hash of every *whole* file.
          files: /mnt/alhajda-work/out/release/*
          fail_on_unmatched_files: true

      - name: Verify published release with alhajda-update (as an older install would see it)
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          U=os/rootfs-overlay/usr/local/bin/alhajda-update
          for i in 1 2 3 4 5 6; do
            out=$($U --check --current 1.0.0 || true); echo "$out"
            echo "$out" | grep -q "latest=${ALHAJDA_VERSION} " && break
            sleep 20
          done
          echo "$out" | grep -q "ALHAJDA_UPDATE: available current=1.0.0 latest=${ALHAJDA_VERSION} tag=os-v${ALHAJDA_VERSION}"
          $U --download-only "$RUNNER_TEMP/dl" --current 1.0.0 | tee "$RUNNER_TEMP/dl.txt"
          grep -q 'ALHAJDA_UPDATE: verified sha256=' "$RUNNER_TEMP/dl.txt"
          tar -tzf "$RUNNER_TEMP/dl/alhajda-update-${ALHAJDA_VERSION}.tar.gz" > "$RUNNER_TEMP/dl/list.txt"
          grep 'overlay/usr/local/bin/alhajda-update' "$RUNNER_TEMP/dl/list.txt"
