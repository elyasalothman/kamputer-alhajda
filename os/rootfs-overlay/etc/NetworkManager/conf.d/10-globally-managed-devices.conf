# «الهجدة»: let NetworkManager manage wired (ethernet) devices too.
# Ubuntu's network-manager ships /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf
# that leaves ethernet unmanaged unless netplan configures it; this same-named file overrides it,
# so VMs (Hyper-V / VirtualBox / QEMU) get internet automatically.
