<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Alhajda: prefer Noto Naskh / Kufi for Arabic text -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic UI</string><string>Noto Kufi Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>Noto Sans Arabic UI</family><family>Noto Kufi Arabic</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family></prefer></alias>
</fontconfig>
