# Alhajda GRUB defaults (GRUB fonts cannot shape Arabic, so the menu uses the Latin name)
GRUB_DISTRIBUTOR="Alhajda"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# serial console first, screen last (= /dev/console); lets headless VMs/CI read boot logs
GRUB_CMDLINE_LINUX="console=ttyS0,115200 console=tty0"
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200"
